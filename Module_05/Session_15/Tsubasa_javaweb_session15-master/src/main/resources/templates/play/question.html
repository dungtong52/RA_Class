<!DOCTYPE html>
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Question!</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1>QUESTION <span th:text="${question.id}"></span> !</h1>
        <form th:action="@{/}" th:object="${question}" method="post">
            <div class="form-group">
                <label for="id">Id</label>
                <input type="text" id="id" class="form-control" th:field="*{id}" readonly>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" class="form-control" th:field="*{content}" readonly></textarea>
            </div>
            <div class="form-group">
                <label for="answerA">Answer A</label>
                <input type="radio" name="answer" id="answerA" th:field="*{answerTrue}" th:value="${question.answerA}"><span th:text="${question.answerA}"></span>
            </div>
            <div class="form-group">
                <label for="answerB">Answer B</label>
                <input type="radio" name="answer" id="answerB" th:field="*{answerTrue}" th:value="${question.answerB}"><span th:text="${question.answerB}"></span>
            </div>
            <div class="form-group">
                <label for="answerC">Answer C</label>
                <input type="radio" name="answer" id="answerC" th:field="*{answerTrue}" th:value="${question.answerC}"><span th:text="${question.answerC}"></span>
            </div>
            <div class="form-group">
                <label for="answerD">Answer D</label>
                <input type="radio" name="answer" id="answerD" th:field="*{answerTrue}" th:value="${question.answerD}"><span th:text="${question.answerD}"></span>
            </div>
            <div class="form-group">
                <div class="form-group">
                    <input type="submit" value="Answer" class="btn btn-primary">
                    <input type="reset" value="Clear" class="btn btn-secondary">
                </div>
            </div>
        </form>
        <a th:href="@{/play/exam/{examId}(examId=${examId})/questions}">List Questions Of Exam</a>
    </div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
